[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "j2-agency-benchmark"
version = "0.1.0"
description = "Open-data agency-budget benchmark for myoelectric prosthetic shared autonomy"
requires-python = ">=3.11"
authors = [{ name = "J2 Benchmark Team" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "tqdm>=4.66",
  "joblib>=1.3",
  "tabulate>=0.9",
  "stream-unzip>=0.0.101",
  "wfdb>=4.3",
]

[project.optional-dependencies]
deep = [
  "torch>=2.3",
  "mne>=1.7",
]
workflow = [
  "snakemake>=8.0",
  "dvc>=3.50",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

