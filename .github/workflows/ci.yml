name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check no raw data
        run: python scripts/check_no_raw_data.py --root .
      - name: Check release integrity
        run: python scripts/check_release_integrity.py --root .
      - name: Run tests
        run: pytest
      - name: Check committed figure assets
        run: python scripts/check_tnsre_figures.py --out-dir results/reports/tnsre_figures --recursive --min-pdfs 11 --min-width 1800 --min-height 1800 --min-dpi 300

