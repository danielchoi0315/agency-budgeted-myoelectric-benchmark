    role: "optional_hd_semg_many_gestures"
    official_page: "https://www.nature.com/articles/s41597-021-00843-9"
    canonical_doi: "10.1038/s41597-021-00843-9"
    access_date: "2026-04-15"
    data_sources:
      figshare_metadata: "https://doi.org/10.6084/m9.figshare.13625828"
    expected_modalities:
      - "HD-sEMG"
      - "force"
    expected_groups:
      - "able_bodied"
    expected_counts:
      subjects: 20
      gestures_unique: 65
      channels: 128
      repetitions: 5
    paper_anchor:
      citation: "Malesevic et al., Scientific Data 2021"
      role: "Optional many-class HD-sEMG classifier stress test."

  hd_fw_kin:
